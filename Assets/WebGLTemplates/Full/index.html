<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#08070c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Magic Survivors">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>{{{ PRODUCT_NAME }}}</title>
  <style>
    html, body { margin: 0; height: 100%; background: #08070c; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
    #c { position: fixed; inset: 0; width: 100vw; height: 100dvh; display: block; background: #08070c; }
    #load { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
            color: #dccdae; font: 600 22px/1.2 Georgia, serif; letter-spacing: .04em; }
    #bar { width: min(70vw, 360px); height: 6px; border-radius: 3px; background: #1d1a24; overflow: hidden; }
    #fill { width: 0; height: 100%; background: linear-gradient(90deg, #8a6a32, #e0b05a); transition: width .2s; }
    #err { color: #e07060; font: 14px/1.4 system-ui, sans-serif; max-width: 80vw; text-align: center; }
  </style>
</head>
<body>
  <canvas id="c" tabindex="-1"></canvas>
  <div id="load"><div>{{{ PRODUCT_NAME }}}</div><div id="bar"><div id="fill"></div></div><div id="err"></div></div>
  <script>
    // Unity на WebGL рисует по requestAnimationFrame и игнорирует Application.targetFrameRate: на 120-герцовом
    // экране выходило 120 кадров в секунду. Режем частоту здесь, до старта рантайма; игра сообщает свою настройку
    // через SetFrameCap (GameLoot.cs). ?fps= в адресе перебивает всё — так меряет стенд.
    // Кадры копим в очередь, а выдаём пачкой на своём такте: если просто не звать колбэк Unity, её цикл встаёт
    // (проверено: игра шла 1 кадр в секунду).
    (function () {
      var raf = window.requestAnimationFrame.bind(window);
      var cap = 60, last = -Infinity, queue = [];
      var q = new URLSearchParams(location.search);
      if (q.has("fps")) cap = parseFloat(q.get("fps")) || 0;
      function flush() {
        if (!queue.length) return;
        var cbs = queue, now = performance.now();
        queue = [];
        for (var i = 0; i < cbs.length; i++) cbs[i](now);
      }
      var next = 0;
      window.SetFrameCap = function (fps) { cap = fps | 0; next = 0; flush(); };
      raf(function tick(t) {
        if (!cap) { flush(); raf(tick); return; }
        var step = 1000 / cap;
        if (!next) next = t;
        if (t >= next - 1) {
          next += step;
          if (t - next > step) next = t + step;
          flush();
        }
        raf(tick);
      });
      window.requestAnimationFrame = function (cb) { queue.push(cb); return 0; };
    })();
  </script>
  <script>
    var canvas = document.getElementById("c");
    var config = {
      dataUrl: "Build/{{{ DATA_FILENAME }}}",
      frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
      codeUrl: "Build/{{{ CODE_FILENAME }}}",
#if MEMORY_FILENAME
      memoryUrl: "Build/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
      symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
      streamingAssetsUrl: "StreamingAssets",
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      // на телефонах dpr 3 — рисовать в 3 раза больше пикселей незачем
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 1.5),
      matchWebGLToCanvasSize: true,
    };
    var s = document.createElement("script");
    s.src = "Build/{{{ LOADER_FILENAME }}}";
    s.onload = function () {
      createUnityInstance(canvas, config, function (p) {
        document.getElementById("fill").style.width = (p * 100) + "%";
      }).then(function () {
        document.getElementById("load").remove();
      }).catch(function (e) {
        document.getElementById("err").textContent = e;
      });
    };
    document.body.appendChild(s);
  </script>
</body>
</html>
